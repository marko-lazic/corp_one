[workspace]
resolver = "2"

members = [
    "corp_client",
    "corp_server",
    "corp_shared",
    "corp_types",
    "corp_proxy",
    "tools/ci",
    "corp_login",
    "corp_world",
    "archive",
]
default-members = ["corp_client", "corp_login", "corp_server", "corp_shared", "corp_proxy"]
exclude = [
    "benches",
    "integration_tests",
]

[workspace.dependencies]
bevy = { version = "0.17", default-features = false }
serde = { version = "1", default-features = false }
rmp-serde = "1.3.0"
avian3d = { version = "0.4.1", default-features = false }
rand = "0.9"
bevy_rand = { version = "0.12", features = ["wyrand"] }
tokio = { version = "1.45", default-features = false }
anyhow = "1.0.98"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
surf = { version = "2.3", default-features = false, features = ["h1-client-rustls", "encoding"] }
kameo = { version = "0.19" }
kameo_actors = { version = "0.4.0" }
sqlx = { version = "0.8.6", default-features = false }
envy = "0.4.2"
dotenvy = "0.15.7"
async-nats = "0.45.0"

aeronet = { version = "0.18.0", default-features = false }
aeronet_webtransport = { version = "0.18.0", default-features = false }
aeronet_replicon = { version = "0.18.0", default-features = false }
bevy_replicon = { version = "0.37.1", default-features = false }
bevy_defer = { version = "0.15", default-features = false }

[patch.crates-io]
avian3d = { git = "https://github.com/avianphysics/avian" }