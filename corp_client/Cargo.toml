[package]
name = "corp_client"
version = "0.1.0"
authors = ["marko.lazic <markolazic@protonmail.com>"]
edition = "2024"

[dependencies]
corp_shared = { path = "../corp_shared", features = ["client"] }
corp_types = { path = "../corp_types" }
bevy = { workspace = true, default-features = false, features = [
    "default",
    "bevy_post_process",
    "bevy_remote",
    "bevy_animation",
    "serialize",
    "dynamic_linking",
    "track_location"
] }
avian3d = { workspace = true, features = ["default", "enhanced-determinism", "serialize"] }
bevy_enhanced_input = "0.27.2"
bevy-inspector-egui = "0.38.0"
bevy_asset_loader = { version = "0.28.1", default-features = false, features = ["3d"] }
bevy_kira_audio = { version = "0.27.1", default-features = false, features = [
    "wav",
    "ogg",
] }
bevy_dolly = { git = "https://github.com/marko-lazic/bevy_dolly.git", branch = "main", default-features = false, features = [
    "drivers",
] }
bevy_skein = { version = "0.7.0" }
bevy_framepace = { version = "0.23.0" }
rand = { workspace = true }
bevy_rand = { workspace = true }
aeronet = { workspace = true }
aeronet_webtransport = { workspace = true, features = ["client", "dangerous-configuration"] }
aeronet_replicon = { workspace = true, features = ["client"] }
bevy_replicon = { workspace = true, features = ["default"] }
bevy_defer = { workspace = true, features = ["default"] }
log = "0.4.35"
clap = { version = "4.6", features = ["derive"] }
surf = { workspace = true }

[dev-dependencies]
bevy_panorbit_camera = "0.36.0"


[[example]]
name = "transforms"
path = "examples/transforms.rs"

[[example]]
name = "vector_bullet"
path = "examples/vector_bullet.rs"

[[example]]
name = "barrier"
path = "examples/shader/barrier.rs"

[[example]]
name = "force_field"
path = "examples/shader/force_field.rs"

[[example]]
name = "state"
path = "examples/state/state.rs"
